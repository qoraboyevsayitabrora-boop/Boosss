name: rucoy-watch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Test message (1 = yes)"
        required: false
        default: "0"

concurrency:
  group: rucoy-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr ffmpeg

      - name: Install Python packages
        run: |
          pip install -U "yt-dlp[default]" bgutil-ytdlp-pot-provider
          pip install opencv-python-headless numpy pytesseract requests

      - name: Start PO token provider
        run: |
          docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
          sleep 8

      - name: Check stream access
        continue-on-error: true
        run: yt-dlp --js-runtimes node -v -g "${{ secrets.STREAM_URL }}" 2>&1 | tail -n 25 | sed 's#https\?://[^ ]*#<url>#g'

      - name: Run watcher
        env:
          STREAM_URL: ${{ secrets.STREAM_URL }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TEST: ${{ github.event.inputs.test }}
          USE_YTDLP: "1"
          YTDLP_ARGS: "--js-runtimes node"
          MAX_HEIGHT: "720"
        run: python rucoy_watch-1.py
